# League configuration TEMPLATE.
#
# This is the file new profiles are seeded from — it is not read directly.
# Edit your own copy at profiles/<your-name>/league.yaml instead; everything
# downstream (tiers, replacement level, best-available, autopilot) reads from
# there.
#
# Defaults below match the confirmed starter construction: 1 QB, 2 RB, 2 WR,
# 1 TE, 2 W/R/T flex, 1 DEF — no kicker. Team count and scoring are still
# guesses; update them (and bench/IR, not visible in what confirmed this)
# to match your actual league before you draft.

league:
  name: "My League"             # update to your league's name
  yahoo_league_id: null         # fill in once the league exists / API access is approved
  num_teams: 10
  scoring: ppr                  # ppr | half_ppr | standard
  superflex: false
  te_premium: false

roster:
  starters:
    QB: 1
    RB: 2
    WR: 2
    TE: 1
    FLEX: 2        # W/R/T — this league starts two, not the usual one
    DEF: 1
    # No K: this league has no kicker slot at all. The engine treats an
    # absent position as "never draft this," not "assume the usual 1" — a
    # kicker is now unrostable regardless of how good its ADP looks.
  bench: 6
  ir: 1

draft:
  scheduled_at: null   # fill in once known — lets the assistant warn how much prep time is left

season:
  # Kickoff of Week 1. Everything in-season derives the current week from this,
  # and refuses to guess a week without it rather than risk setting a Week 3
  # lineup in Week 4.
  week1_start: "2026-09-10"

waivers:
  # faab = blind bidding out of a season budget; priority = a numbered order
  # that drops to last when you claim. Check League -> Settings on Yahoo; the
  # weekly report prints which one it assumed so a wrong guess is obvious.
  system: faab
  faab_budget: 100
  faab_remaining: 100   # update as you spend, or bids get priced off the wrong base
  priority: null        # your current waiver priority, if system: priority
  run_day: wednesday    # when claims process — see WEEKLY.md for the weekly rhythm

autopilot:
  strategy: best_player_available   # best_player_available | robust_rb | zero_rb
  risk_tolerance: balanced          # safe_floor | balanced | chase_upside
  # Never let autopilot draft a position beyond this many total roster spots
  # (starters + this many bench slots) — keeps it from hoarding, say, 6 RBs.
  max_bench_per_pos: 3

rivals:
  # Add manager/team names here once known — powers the trade-flood targeting.
  # - name: "Team Name"
  #   manager: "Manager Name"
  #   notes: ""
  []
